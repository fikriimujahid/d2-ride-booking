version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ridebooking-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: rootpassword # pragma: allowlist secret  
      POSTGRES_DB: ridebooking
      POSTGRES_USER: user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ridebooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ridebooking-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
