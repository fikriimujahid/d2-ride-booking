version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ridebooking-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # pragma: allowlist secret  
      MYSQL_DATABASE: ridebooking
      MYSQL_USER: user
      MYSQL_PASSWORD: password # pragma: allowlist secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: ridebooking-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
