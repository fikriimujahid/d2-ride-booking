name: Deploy via SSM Run Command

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS Region (e.g., ap-southeast-1)
        required: true
        default: ap-southeast-1
      project:
        description: Project tag value (e.g., d2-ride-booking)
        required: true
        default: d2-ride-booking
      environment:
        description: Environment tag value (e.g., dev)
        required: true
        default: dev
      s3_bucket:
        description: S3 bucket name holding artifacts (Terraform output bootstrap_s3_bucket)
        required: true
      s3_key:
        description: S3 key to artifact tar.gz (e.g., artifacts/app.tgz)
        required: true
        default: artifacts/app.tgz

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve target instance id by tags
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:project,Values=${{ inputs.project }}" \
              "Name=tag:environment,Values=${{ inputs.environment }}" \
              "Name=tag:Role,Values=bootstrap" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running bootstrap instance found for project/environment." >&2
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact via SSM Run Command
        shell: bash
        run: |
          set -euo pipefail

          aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy artifact via ssm-deploy" \
            --parameters commands="sudo /usr/local/bin/ssm-deploy '${{ inputs.s3_bucket }}' '${{ inputs.s3_key }}'" \
            --timeout-seconds 600
