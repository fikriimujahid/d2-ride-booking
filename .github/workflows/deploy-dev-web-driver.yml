name: Web Driver Deploy (dev)

on:
  push:
    branches: [dev]
    paths:
      - frontend/web_driver/**

permissions:
  id-token: write
  contents: read

concurrency:
  # Previously shared the same concurrency group as EC2 deploy workflows.
  # Since web_driver is no longer deployed to EC2 from this workflow,
  # keep a dedicated group to avoid blocking unrelated deploys.
  # group: deploy-dev-ec2
  group: deploy-dev-web-driver
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "release_id=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate web_driver .env.production
        working-directory: frontend/web_driver
        shell: bash
        env:
          WEB_DRIVER_AUTH_API_BASE_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_BASE_URL }}
          WEB_DRIVER_AUTH_API_BASE_URL_SECRET: ${{ secrets.NEXT_PUBLIC_AUTH_API_BASE_URL }}
        run: |
          set -euo pipefail
          # Prefer an environment/repo variable; fall back to a secret.
          API_BASE_URL="${WEB_DRIVER_AUTH_API_BASE_URL:-${WEB_DRIVER_AUTH_API_BASE_URL_SECRET:-}}"
          if [ -z "${API_BASE_URL}" ]; then
            echo "Missing NEXT_PUBLIC_AUTH_API_BASE_URL (set as GitHub Actions variable or secret)." >&2
            exit 1
          fi
          printf "NEXT_PUBLIC_AUTH_API_BASE_URL=%s\n" "${API_BASE_URL}" > .env.production

      - name: Build web_driver
        working-directory: frontend/web_driver
        run: |
          npm ci
          npm run build

      - name: Package web_driver artifact
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ steps.meta.outputs.release_id }}"
          mkdir -p artifacts
          # Next.js static export emits frontend/web_driver/out
          tar -czf "artifacts/web_driver-${RID}.tgz" -C frontend/web_driver out

      - name: Upload web_driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_driver-${{ steps.meta.outputs.release_id }}
          path: artifacts/web_driver-${{ steps.meta.outputs.release_id }}.tgz
          if-no-files-found: error

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download web_driver artifact
        uses: actions/download-artifact@v4
        with:
          name: web_driver-${{ needs.build.outputs.release_id }}
          path: artifacts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload web_driver artifact to S3
        id: s3
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.DEPLOY_S3_BUCKET }}"
          RID="${{ needs.build.outputs.release_id }}"

          web_driver_key="artifacts/dev/${RID}/web_driver.tgz"

          aws s3 cp "artifacts/web_driver-${RID}.tgz" "s3://${BUCKET}/${web_driver_key}" --only-show-errors

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "web_driver_key=${web_driver_key}" >> "$GITHUB_OUTPUT"

      - name: Deploy web_driver to S3 website bucket
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ needs.build.outputs.release_id }}"
          DRIVER_BUCKET="${{ secrets.WEB_DRIVER_S3_BUCKET }}"

          mkdir -p web_driver_unpack
          tar -xzf "artifacts/web_driver-${RID}.tgz" -C web_driver_unpack
          aws s3 sync "web_driver_unpack/out" "s3://${DRIVER_BUCKET}/" --delete

