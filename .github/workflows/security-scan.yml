name: Security Scan

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Web Admin audit
        working-directory: frontend/web_admin
        run: npm audit --omit=dev --audit-level=high

      - name: Web Driver audit
        working-directory: frontend/web_driver
        run: npm audit --omit=dev --audit-level=high

      - name: Web Passenger audit
        working-directory: frontend/web_passenger
        run: npm audit --omit=dev --audit-level=high

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (vulns + misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
