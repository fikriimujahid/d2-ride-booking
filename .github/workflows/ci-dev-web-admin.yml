name: CI Web Admin (dev)

on:
  pull_request:
    branches: [dev]
    paths:
      - frontend/web_admin/**
  push:
    branches: [dev]
    paths:
      - frontend/web_admin/**

permissions:
  contents: read

concurrency:
  group: ci-dev-web-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web_admin:
    name: Web Admin (lint/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web_admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web_admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
