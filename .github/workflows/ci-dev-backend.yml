name: CI Backend (dev)

on:
  pull_request:
    branches: [dev]
    paths:
      - api/**
  push:
    branches: [dev]
    paths:
      - api/**

permissions:
  contents: read

concurrency:
  group: ci-dev-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests/lint/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/auth-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/auth-api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: npm audit (high+)
        run: npm audit --audit-level=high
