name: Web Admin Deploy (dev)

on:
  push:
    branches: [dev]
    paths:
      - frontend/web_admin/**

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev-web-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "release_id=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate web_admin .env
        working-directory: frontend/web_admin
        shell: bash
        run: |
          set -euo pipefail
          # Prefer an explicit dev environment secret; fall back to a sensible default.
          API_BASE_URL="${{ secrets.WEB_ADMIN_VITE_API_BASE_URL }}"
          if [ -z "${API_BASE_URL}" ]; then
            API_BASE_URL="/api/v1"
          fi
          printf "VITE_API_BASE_URL=%s\n" "${API_BASE_URL}" > .env

      - name: Build web_admin
        working-directory: frontend/web_admin
        run: |
          npm ci
          npm run build

      - name: Package web_admin artifact
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/deploy/package-artifacts.sh
          infra/deploy/package-artifacts.sh artifacts "${{ steps.meta.outputs.release_id }}" web_admin

      - name: Upload web_admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_admin-${{ steps.meta.outputs.release_id }}
          path: artifacts/web_admin-${{ steps.meta.outputs.release_id }}.tgz
          if-no-files-found: error

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download web_admin artifact
        uses: actions/download-artifact@v4
        with:
          name: web_admin-${{ needs.build.outputs.release_id }}
          path: artifacts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Web Admin to S3 website bucket
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ needs.build.outputs.release_id }}"
          ADMIN_BUCKET="${{ secrets.WEB_ADMIN_S3_BUCKET }}"

          mkdir -p web_admin_unpack
          tar -xzf "artifacts/web_admin-${RID}.tgz" -C web_admin_unpack
          aws s3 sync "web_admin_unpack/dist" "s3://${ADMIN_BUCKET}/" --delete
