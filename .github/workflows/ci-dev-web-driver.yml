name: CI Web Driver (dev)

on:
  pull_request:
    branches: [dev]
    paths:
      - frontend/web_driver/**
  push:
    branches: [dev]
    paths:
      - frontend/web_driver/**

permissions:
  contents: read

concurrency:
  group: ci-dev-web-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web_driver:
    name: Web Driver (lint/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web_driver
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web_driver/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high
