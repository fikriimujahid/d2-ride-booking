name: Deploy (dev)

on:
  workflow_run:
    workflows: ["CI (dev)"]
    branches: [dev]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "release_id=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend
        working-directory: api/auth-api
        run: |
          npm ci
          npm run build

      - name: Build web_admin
        working-directory: frontend/web_admin
        run: |
          npm ci
          npm run build

      - name: Build web_driver
        working-directory: frontend/web_driver
        run: |
          npm ci
          npm run build

      - name: Build web_passenger
        working-directory: frontend/web_passenger
        run: |
          npm ci
          npm run build

      - name: Package artifacts
        shell: bash
        run: |
          chmod +x infra/deploy/package-artifacts.sh
          infra/deploy/package-artifacts.sh artifacts "${{ steps.meta.outputs.release_id }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.release_id }}
          path: artifacts/*.tgz
          if-no-files-found: error

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: artifacts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifacts to S3
        id: s3
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.DEPLOY_S3_BUCKET }}"
          RID="${{ needs.build.outputs.release_id }}"

          backend_key="artifacts/dev/${RID}/backend.tgz"
          web_driver_key="artifacts/dev/${RID}/web_driver.tgz"
          web_passenger_key="artifacts/dev/${RID}/web_passenger.tgz"

          aws s3 cp "artifacts/backend-${RID}.tgz" "s3://${BUCKET}/${backend_key}" --only-show-errors
          aws s3 cp "artifacts/web_driver-${RID}.tgz" "s3://${BUCKET}/${web_driver_key}" --only-show-errors
          aws s3 cp "artifacts/web_passenger-${RID}.tgz" "s3://${BUCKET}/${web_passenger_key}" --only-show-errors

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "backend_key=${backend_key}" >> "$GITHUB_OUTPUT"
          echo "web_driver_key=${web_driver_key}" >> "$GITHUB_OUTPUT"
          echo "web_passenger_key=${web_passenger_key}" >> "$GITHUB_OUTPUT"

      - name: Deploy Web Admin to S3 website bucket
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ needs.build.outputs.release_id }}"
          ADMIN_BUCKET="${{ secrets.WEB_ADMIN_S3_BUCKET }}"

          # Unpack the web_admin artifact and sync the dist/ directory.
          mkdir -p web_admin_unpack
          tar -xzf "artifacts/web_admin-${RID}.tgz" -C web_admin_unpack
          aws s3 sync "web_admin_unpack/dist" "s3://${ADMIN_BUCKET}/" --delete

      - name: Resolve target instance id
        id: instance
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ secrets.EC2_INSTANCE_ID }}" ]]; then
            echo "instance_id=${{ secrets.EC2_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_TAG="${{ secrets.EC2_TAG_PROJECT }}"
          ENV_TAG="${{ secrets.EC2_TAG_ENVIRONMENT }}"

          if [[ -z "${PROJECT_TAG}" || -z "${ENV_TAG}" ]]; then
            echo "Set either EC2_INSTANCE_ID or both EC2_TAG_PROJECT + EC2_TAG_ENVIRONMENT in GitHub Environment 'dev'." >&2
            exit 1
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:project,Values=${PROJECT_TAG}" \
              "Name=tag:environment,Values=${ENV_TAG}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running instance found for project/environment tags" >&2
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM Run Command
        id: ssm
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          BUCKET="${{ steps.s3.outputs.bucket }}"
          RID="${{ needs.build.outputs.release_id }}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "d2 deploy dev ${RID}" \
            --parameters commands="sudo /usr/local/bin/ssm-deploy '${BUCKET}' '${RID}' '${{ steps.s3.outputs.backend_key }}' '${{ steps.s3.outputs.web_driver_key }}' '${{ steps.s3.outputs.web_passenger_key }}'" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        shell: bash
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Show SSM output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
